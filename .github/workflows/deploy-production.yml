name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Check generated content catalogs
        run: npm run check:content-catalogs

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify Turnstile site key
        run: test -n "$VITE_TURNSTILE_SITE_KEY"

      - name: Publish and verify immutable static media
        env:
          PARROT_MEDIA_ORIGIN: https://media.parrotbook.com
          PARROT_MEDIA_PUBLIC_BUCKET: parrot-english-media
        run: npm run publish:static-media -- --apply

      - name: Build
        run: npm run build

      - name: Typecheck LiveKit agent
        run: npm run build:agent

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply parrot-english --remote

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:worker
