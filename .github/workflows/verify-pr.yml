name: Verify pull requests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0.18
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: parrot_aliyun_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARROT_TEST_DATABASE_URL: mysql://root:disposable-test-password@127.0.0.1:3306/parrot_aliyun_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Prepare verified TLS for the disposable MySQL database
        run: |
          node scripts/prepare-aliyun-mysql-test-tls.mjs '${{ job.services.mysql.id }}' "$RUNNER_TEMP/mysql-test-ca.pem"
          echo "PARROT_TEST_DATABASE_CA_PATH=$RUNNER_TEMP/mysql-test-ca.pem" >> "$GITHUB_ENV"

      - name: Run tests including mounted lifecycle
        run: npm test

      - name: Verify MySQL baseline and build Alibaba backend
        run: |
          node scripts/build-aliyun-mysql-schema.mjs
          git diff --exit-code -- backend/mysql-baseline.sql
          npm run build:aliyun

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser behavior tests
        run: npm run test:browser

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
