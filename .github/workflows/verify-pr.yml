name: Verify pull requests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: parrot_aliyun_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARROT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/parrot_aliyun_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests including mounted lifecycle
        run: npm test

      - name: Verify PostgreSQL baseline and build Alibaba backend
        run: |
          node scripts/build-aliyun-schema.mjs
          git diff --exit-code -- backend/postgres-baseline.sql
          npm run build:aliyun

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser behavior tests
        run: npm run test:browser

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
