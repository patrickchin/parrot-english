name: Mobile browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Firefox and native browser dependencies
        run: npx playwright install --with-deps firefox
      - name: Install the short-video fixture tool
        run: sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Check Firefox touch viewports, capture, drafts, sharing, and owner controls
        shell: bash
        env:
          PLAYWRIGHT_PORT: '21337'
        run: npm run test:browser -- --config=playwright.mobile.config.ts --project=mobile-qa-firefox 2>&1 | tee mobile-browser.log
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-firefox-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            mobile-browser.log
            test-results/
            ~/Pictures/Screenshots/Codex/parrot-english/mobile-qa-firefox-*.png
