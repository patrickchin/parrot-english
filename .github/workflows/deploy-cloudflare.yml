name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      media_only:
        description: Publish R2 media without deploying the application
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Apply immutable media cache metadata
        env:
          MEDIA_SOURCE_COMMIT: 2fe8e5ef8e82254a0bc271dfb620d1c7811b6a8a
        run: |
          set -euo pipefail
          sample="https://media.parrotbook.com/assets/v2/characters/peppa/peppa-idle.webp"
          if curl --fail --silent --show-error --head "$sample" | tr -d '\r' | grep -Eqi '^cache-control:.*max-age=31536000.*immutable'; then
            exit 0
          fi

          if ! git cat-file -e "$MEDIA_SOURCE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin codex/account-sign-out-recovery
          fi
          mapfile -t media_paths < <(
            git ls-tree -r --name-only "$MEDIA_SOURCE_COMMIT" public/assets |
              grep -E '\.webp$'
          )
          test "${#media_paths[@]}" -eq 171

          for path in "${media_paths[@]}"; do
            object="parrot-english-media/assets/v2/${path#public/assets/}"
            git show "$MEDIA_SOURCE_COMMIT:$path" | npx wrangler r2 object put "$object" \
              --pipe \
              --remote \
              --content-type image/webp \
              --cache-control "public, max-age=31536000, immutable"
          done

          curl --fail --retry 5 --retry-all-errors --silent --show-error --head "$sample" |
            tr -d '\r' |
            grep -Eqi '^cache-control:.*max-age=31536000.*immutable'

      - name: Publish immutable brand media
        env:
          BRAND_SOURCE_COMMIT: 2e89ea80454de32777b55cd0f65a648ef4a619a2
        run: |
          set -euo pipefail
          for file in \
            apple-touch-icon.png \
            favicon.png \
            icon-192.png \
            icon-512.png \
            social-card.png
          do
            object="parrot-english-media/assets/v2/brand/$file"
            expected="$({ git show "$BRAND_SOURCE_COMMIT:public/$file" || exit 1; } | sha256sum | cut -d ' ' -f 1)"

            if actual="$(npx wrangler r2 object get "$object" --pipe --remote 2>/dev/null | sha256sum | cut -d ' ' -f 1)"; then
              test "$actual" = "$expected"
              continue
            fi

            git show "$BRAND_SOURCE_COMMIT:public/$file" | npx wrangler r2 object put "$object" \
              --pipe \
              --remote \
              --content-type image/png \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Build
        if: ${{ inputs.media_only != true }}
        run: npm run build

      - name: Typecheck LiveKit agent
        if: ${{ inputs.media_only != true }}
        run: npm run build:agent

      - name: Apply D1 migrations
        if: ${{ inputs.media_only != true }}
        run: npx wrangler d1 migrations apply parrot-english --remote

      - name: Deploy to Cloudflare Workers
        if: ${{ inputs.media_only != true }}
        run: npm run deploy:worker
