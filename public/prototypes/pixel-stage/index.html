<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel stage proof of concept</title>
    <style>
      :root {
        color: #183153;
        font-family: ui-rounded, "Nunito", system-ui, sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: #fff3d7;
      }

      .page {
        display: grid;
        min-height: 100vh;
        align-content: center;
        gap: 16px;
        padding: 20px;
      }

      .intro {
        display: grid;
        min-width: 0;
        justify-items: center;
        text-align: center;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        width: 100%;
        font-size: clamp(1.45rem, 5vw, 2.5rem);
        line-height: 1.05;
      }

      .intro p {
        width: 100%;
        max-width: 44rem;
        margin-top: 8px;
        color: #4d607b;
        font-weight: 700;
      }

      .stage {
        position: relative;
        isolation: isolate;
        width: min(100%, 1080px);
        aspect-ratio: 3 / 2;
        margin: auto;
        overflow: hidden;
        border: 2px solid #fff;
        border-radius: 4px;
        background: #142039;
        box-shadow:
          0 0 0 4px #183153,
          0 12px 0 #18315333;
      }

      .world {
        --scale: 1;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 240px;
        height: 160px;
        transform: translate(-50%, -50%) scale(var(--scale));
        transform-origin: center;
        background: url("./assets/garden.png") 0 0 / 240px 160px no-repeat;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      .actor {
        --depth: 212;
        --x: 120;
        --y: 112;
        position: absolute;
        top: calc(var(--y) * 1px);
        left: calc(var(--x) * 1px);
        z-index: var(--depth);
        width: 64px;
        height: 64px;
        transform: translate(-50%, -100%);
      }

      .sprite {
        --column: 0;
        --row: 0;
        width: 64px;
        height: 64px;
        background-image: url("./assets/peppa-sheet.png");
        background-position:
          calc(var(--column) * 100% / 3)
          calc(var(--row) * 100% / 3);
        background-repeat: no-repeat;
        background-size: 400% 400%;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      .actor[data-facing="left"] .sprite {
        transform: scaleX(-1);
      }

      .foreground {
        position: absolute;
        inset: 0;
        z-index: 400;
        background: url("./assets/foreground.png") 0 0 / 240px 160px no-repeat;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        pointer-events: none;
      }

      .hud {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        padding: 6px 9px;
        border: 3px solid #183153;
        border-radius: 2px;
        background: #fffbe8;
        color: #183153;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        box-shadow: 3px 3px 0 #183153;
      }

      .coordinates {
        display: block;
        margin-top: 2px;
        color: #c64155;
        letter-spacing: 0;
        text-transform: lowercase;
      }

      .speech {
        position: absolute;
        z-index: 3;
        bottom: 10px;
        left: 50%;
        display: grid;
        width: min(calc(100% - 24px), 560px);
        min-height: 62px;
        align-content: center;
        translate: -50% 0;
        padding: 9px 13px;
        border: 4px solid #183153;
        border-radius: 2px;
        outline: 2px solid #fffbe8;
        outline-offset: -7px;
        background: #fffbe8;
        color: #183153;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: clamp(0.8rem, 3.2vw, 1.05rem);
        font-weight: 900;
        line-height: 1.2;
        text-align: left;
        box-shadow: 4px 4px 0 #18315366;
      }

      .speaker {
        color: #c64155;
        text-transform: uppercase;
      }

      .controls {
        display: grid;
        width: min(100%, 720px);
        justify-content: center;
        gap: 10px;
        margin: auto;
      }

      .emote-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .movement-panel {
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .move-label {
        color: #4d607b;
        font-size: 0.82rem;
        font-weight: 900;
      }

      .move-pad {
        display: grid;
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(2, 44px);
        gap: 6px;
      }

      .move-button {
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        touch-action: none;
      }

      .move-button[data-move="up"] {
        grid-column: 2;
      }

      .move-button[data-move="left"] {
        grid-column: 1;
        grid-row: 2;
      }

      .move-button[data-move="down"] {
        grid-column: 2;
        grid-row: 2;
      }

      .move-button[data-move="right"] {
        grid-column: 3;
        grid-row: 2;
      }

      button {
        min-width: 94px;
        min-height: 46px;
        padding: 9px 15px;
        border: 3px solid #183153;
        border-radius: 3px;
        background: #fff;
        color: #183153;
        font: inherit;
        font-weight: 900;
        box-shadow: 4px 4px 0 #183153;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible,
      button[aria-pressed="true"] {
        background: #ffcf38;
        translate: 2px 2px;
        box-shadow: 2px 2px 0 #183153;
      }

      .tech-note {
        flex-basis: 100%;
        color: #4d607b;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.78rem;
        font-weight: 800;
        text-align: center;
      }

      @media (max-width: 520px) {
        .page {
          gap: 12px;
          padding: 12px;
        }

        .hud {
          top: 6px;
          left: 6px;
        }

        .speech {
          bottom: 6px;
          min-height: 58px;
        }

        .emote-controls button {
          min-width: 42%;
          flex: 1 1 42%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Pixel stage proof of concept</h1>
        <p>A real low-resolution game world, enlarged only in whole pixels.</p>
      </header>

      <section class="stage" aria-label="Animated pixel lesson stage">
        <div
          class="world"
          data-scale="1"
          role="group"
          aria-label="Original pixel game world"
        >
          <div
            class="actor"
            data-facing="right"
            data-testid="player-actor"
            data-x="120"
            data-y="112"
          >
            <div
              class="sprite"
              data-state="idle"
              role="img"
              aria-label="Animated pixel Peppa"
            ></div>
          </div>
          <div class="foreground" aria-hidden="true"></div>
        </div>
        <div class="hud">
          240 × 160 world · 24 colors
          <span class="coordinates">x 120 · y 112</span>
        </div>
        <p class="speech" aria-live="polite">
          <span class="speaker">Peppa:</span>
          <span class="speech-copy">Ready for an English adventure?</span>
        </p>
      </section>

      <nav class="controls" aria-label="Pixel world controls">
        <div class="emote-controls">
          <button type="button" aria-pressed="true" data-state="idle">Idle</button>
          <button type="button" aria-pressed="false" data-state="talking">Talking</button>
          <button type="button" aria-pressed="false" data-state="happy">Happy</button>
          <button type="button" aria-pressed="false" data-state="surprised">Surprised</button>
        </div>
        <div class="movement-panel">
          <p class="move-label">Move with arrow keys, WASD, or the pad</p>
          <div class="move-pad" role="group" aria-label="Move Peppa">
            <button class="move-button" type="button" data-move="up" aria-label="Move up">↑</button>
            <button class="move-button" type="button" data-move="left" aria-label="Move left">←</button>
            <button class="move-button" type="button" data-move="down" aria-label="Move down">↓</button>
            <button class="move-button" type="button" data-move="right" aria-label="Move right">→</button>
          </div>
        </div>
        <p class="tech-note">world coordinates · collisions · y-depth · foreground occlusion</p>
      </nav>
    </main>

    <script type="module">
      import {
        PLAYER_START,
        getActorDepth,
        getIntegerScale,
        getSpriteFrame,
        moveActor,
      } from "./sprite-state.js";

      const copy = {
        idle: "Ready for an English adventure?",
        talking: "Let’s practise together!",
        happy: "You did it! Great speaking!",
        surprised: "Oh! What did you find?",
      };
      const stage = document.querySelector(".stage");
      const world = document.querySelector(".world");
      const actor = document.querySelector(".actor");
      const sprite = document.querySelector(".sprite");
      const speech = document.querySelector(".speech-copy");
      const coordinates = document.querySelector(".coordinates");
      const buttons = [...document.querySelectorAll("button[data-state]")];
      const moveButtons = [...document.querySelectorAll("button[data-move]")];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const keyDirections = new Map([
        ["ArrowDown", "down"],
        ["ArrowLeft", "left"],
        ["ArrowRight", "right"],
        ["ArrowUp", "up"],
        ["a", "left"],
        ["d", "right"],
        ["s", "down"],
        ["w", "up"],
      ]);
      let position = { ...PLAYER_START };
      let state = "idle";
      let stateStartedAt = performance.now();
      let movingUntil = 0;
      let moveTimer;

      function resizeWorld() {
        const scale = getIntegerScale(stage.clientWidth, stage.clientHeight);
        world.dataset.scale = String(scale);
        world.style.setProperty("--scale", scale);
      }

      function selectState(nextState) {
        state = nextState;
        stateStartedAt = performance.now();
        sprite.dataset.state = state;
        speech.textContent = copy[state];

        for (const button of buttons) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.state === state),
          );
        }
      }

      function renderActor() {
        actor.dataset.facing = position.facing;
        actor.dataset.x = String(position.x);
        actor.dataset.y = String(position.y);
        actor.style.setProperty("--depth", getActorDepth(position.y));
        actor.style.setProperty("--x", position.x);
        actor.style.setProperty("--y", position.y);
        coordinates.textContent = `x ${position.x} · y ${position.y}`;
      }

      function move(direction) {
        position = moveActor(position, direction);
        movingUntil = performance.now() + 180;
        renderActor();
      }

      function render(now) {
        const animation = now < movingUntil ? "walking" : state;
        const frame = getSpriteFrame(animation, now - stateStartedAt, {
          reducedMotion: reducedMotion.matches,
        });
        sprite.style.setProperty("--column", frame.column);
        sprite.style.setProperty("--row", frame.row);
        requestAnimationFrame(render);
      }

      for (const button of buttons) {
        button.addEventListener("click", () => selectState(button.dataset.state));
      }

      for (const button of moveButtons) {
        const stopMoving = () => clearInterval(moveTimer);
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          stopMoving();
          move(button.dataset.move);
          moveTimer = setInterval(() => move(button.dataset.move), 80);
        });
        button.addEventListener("pointercancel", stopMoving);
        button.addEventListener("pointerleave", stopMoving);
        button.addEventListener("pointerup", stopMoving);
        button.addEventListener("click", (event) => {
          if (event.detail === 0) move(button.dataset.move);
        });
      }

      document.addEventListener("keydown", (event) => {
        const direction = keyDirections.get(event.key);
        if (!direction) return;
        event.preventDefault();
        move(direction);
      });

      new ResizeObserver(resizeWorld).observe(stage);
      renderActor();
      resizeWorld();
      requestAnimationFrame(render);
    </script>
  </body>
</html>
