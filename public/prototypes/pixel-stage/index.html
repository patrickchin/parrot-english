<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel stage proof of concept</title>
    <style>
      :root {
        color: #183153;
        font-family: ui-rounded, "Nunito", system-ui, sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: #fff3d7;
      }

      .page {
        display: grid;
        min-height: 100vh;
        align-content: center;
        gap: 16px;
        padding: 20px;
      }

      .intro {
        display: grid;
        min-width: 0;
        justify-items: center;
        text-align: center;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        width: 100%;
        font-size: clamp(1.45rem, 5vw, 2.5rem);
        line-height: 1.05;
      }

      .intro p {
        width: 100%;
        max-width: 44rem;
        margin-top: 8px;
        color: #4d607b;
        font-weight: 700;
      }

      .stage {
        position: relative;
        isolation: isolate;
        width: min(100%, 1080px);
        aspect-ratio: 3 / 2;
        margin: auto;
        overflow: hidden;
        border: 2px solid #fff;
        border-radius: 4px;
        background: #142039;
        box-shadow:
          0 0 0 4px #183153,
          0 12px 0 #18315333;
      }

      .world {
        --scale: 1;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 80px;
        transform: translate(-50%, -50%) scale(var(--scale));
        transform-origin: center;
        background: url("./assets/garden.png") 0 0 / 120px 80px no-repeat;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      .sprite {
        --column: 0;
        --row: 0;
        position: absolute;
        bottom: 28px;
        left: 44px;
        width: 32px;
        height: 32px;
        background-image: url("./assets/peppa-sheet.png");
        background-position:
          calc(var(--column) * 100% / 3)
          calc(var(--row) * 100% / 3);
        background-repeat: no-repeat;
        background-size: 400% 400%;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      .hud {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        padding: 6px 9px;
        border: 3px solid #183153;
        border-radius: 2px;
        background: #fffbe8;
        color: #183153;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        box-shadow: 3px 3px 0 #183153;
      }

      .speech {
        position: absolute;
        z-index: 3;
        bottom: 10px;
        left: 50%;
        display: grid;
        width: min(calc(100% - 24px), 560px);
        min-height: 62px;
        align-content: center;
        translate: -50% 0;
        padding: 9px 13px;
        border: 4px solid #183153;
        border-radius: 2px;
        outline: 2px solid #fffbe8;
        outline-offset: -7px;
        background: #fffbe8;
        color: #183153;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: clamp(0.8rem, 3.2vw, 1.05rem);
        font-weight: 900;
        line-height: 1.2;
        text-align: left;
        box-shadow: 4px 4px 0 #18315366;
      }

      .speaker {
        color: #c64155;
        text-transform: uppercase;
      }

      .controls {
        display: flex;
        width: min(100%, 720px);
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: auto;
      }

      button {
        min-width: 94px;
        min-height: 46px;
        padding: 9px 15px;
        border: 3px solid #183153;
        border-radius: 3px;
        background: #fff;
        color: #183153;
        font: inherit;
        font-weight: 900;
        box-shadow: 4px 4px 0 #183153;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible,
      button[aria-pressed="true"] {
        background: #ffcf38;
        translate: 2px 2px;
        box-shadow: 2px 2px 0 #183153;
      }

      .tech-note {
        flex-basis: 100%;
        color: #4d607b;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.78rem;
        font-weight: 800;
        text-align: center;
      }

      @media (max-width: 520px) {
        .page {
          gap: 12px;
          padding: 12px;
        }

        .hud {
          top: 6px;
          left: 6px;
        }

        .speech {
          bottom: 6px;
          min-height: 58px;
        }

        button {
          min-width: 42%;
          flex: 1 1 42%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>Pixel stage proof of concept</h1>
        <p>A real low-resolution game world, enlarged only in whole pixels.</p>
      </header>

      <section class="stage" aria-label="Animated pixel lesson stage">
        <div
          class="world"
          data-scale="1"
          role="group"
          aria-label="Original pixel game world"
        >
          <div
            class="sprite"
            data-state="idle"
            role="img"
            aria-label="Animated pixel Peppa"
          ></div>
        </div>
        <div class="hud">120 × 80 world · 24 colors</div>
        <p class="speech" aria-live="polite">
          <span class="speaker">Peppa:</span>
          <span class="speech-copy">Ready for an English adventure?</span>
        </p>
      </section>

      <nav class="controls" aria-label="Sprite animation controls">
        <button type="button" aria-pressed="true" data-state="idle">Idle</button>
        <button type="button" aria-pressed="false" data-state="talking">Talking</button>
        <button type="button" aria-pressed="false" data-state="happy">Happy</button>
        <button type="button" aria-pressed="false" data-state="surprised">Surprised</button>
        <p class="tech-note">32px frames · integer scaling · one shared pixel lattice</p>
      </nav>
    </main>

    <script type="module">
      import { getIntegerScale, getSpriteFrame } from "./sprite-state.js";

      const copy = {
        idle: "Ready for an English adventure?",
        talking: "Let’s practise together!",
        happy: "You did it! Great speaking!",
        surprised: "Oh! What did you find?",
      };
      const stage = document.querySelector(".stage");
      const world = document.querySelector(".world");
      const sprite = document.querySelector(".sprite");
      const speech = document.querySelector(".speech-copy");
      const buttons = [...document.querySelectorAll("button[data-state]")];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let state = "idle";
      let stateStartedAt = performance.now();

      function resizeWorld() {
        const scale = getIntegerScale(stage.clientWidth, stage.clientHeight);
        world.dataset.scale = String(scale);
        world.style.setProperty("--scale", scale);
      }

      function selectState(nextState) {
        state = nextState;
        stateStartedAt = performance.now();
        sprite.dataset.state = state;
        speech.textContent = copy[state];

        for (const button of buttons) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.state === state),
          );
        }
      }

      function render(now) {
        const frame = getSpriteFrame(state, now - stateStartedAt, {
          reducedMotion: reducedMotion.matches,
        });
        sprite.style.setProperty("--column", frame.column);
        sprite.style.setProperty("--row", frame.row);
        requestAnimationFrame(render);
      }

      for (const button of buttons) {
        button.addEventListener("click", () => selectState(button.dataset.state));
      }

      new ResizeObserver(resizeWorld).observe(stage);
      resizeWorld();
      requestAnimationFrame(render);
    </script>
  </body>
</html>
