<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A full-screen Phaser-powered, high-resolution pixel lesson garden for Parrot English."
    />
    <title>Explore Peppa's lesson garden</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Peppa lesson garden exploration stage">
        <h1 class="visually-hidden">Explore Peppa's lesson garden</h1>

        <div
          id="pixel-game"
          class="game-world"
          role="group"
          aria-label="Peppa lesson garden game world"
          data-camera-x="360"
          data-camera-y="132"
          data-camera-zoom="2"
          data-art-pixel-size="1"
          data-depth="1192"
          data-engine="phaser"
          data-frame="0"
          data-landmark-depth="1300"
          data-map-height="480"
          data-map-width="720"
          data-occlusion="open"
          data-player-body-height="24"
          data-player-body-width="48"
          data-ready="false"
          data-sprite-detail-pixel-size="1"
          data-sprite-frame-size="320"
          data-sprite-render-scale="0.5"
          data-sprite-screen-frame-size="320"
          data-sprite-world-frame-size="160"
          data-state="idle"
          data-x="450"
          data-y="192"
        >
          <p class="loading-status" data-engine-status>Growing the lesson garden…</p>
        </div>

        <div class="hud" aria-label="Game status" role="group">
          <span class="hud__place">Lesson garden</span>
          <span data-depth-status>Exploring the lesson garden</span>
          <span class="coordinates" data-coordinates>x 450 · y 192</span>
        </div>

        <p
          class="speech"
          aria-label="Peppa speech"
          aria-live="polite"
          role="group"
        >
          <span class="speaker">Peppa</span>
          <span data-speech-copy>Come on — let's explore the lesson garden!</span>
        </p>

        <nav class="controls" aria-label="Lesson garden game controls">
          <div class="movement-panel">
            <p class="control-label">Move Peppa</p>
            <div class="move-pad" role="group" aria-label="Move Peppa">
              <button
                class="move-button"
                type="button"
                data-move="up"
                aria-label="Move up"
              >
                ↑
              </button>
              <button
                class="move-button"
                type="button"
                data-move="left"
                aria-label="Move left"
              >
                ←
              </button>
              <button
                class="move-button"
                type="button"
                data-move="down"
                aria-label="Move down"
              >
                ↓
              </button>
              <button
                class="move-button"
                type="button"
                data-move="right"
                aria-label="Move right"
              >
                →
              </button>
            </div>
          </div>

          <div class="emote-panel">
            <p class="control-label">Peppa's mood</p>
            <div class="emote-controls" aria-label="Peppa animations" role="group">
              <button
                type="button"
                aria-label="Idle animation"
                aria-pressed="true"
                data-state="idle"
              >
                Idle
              </button>
              <button
                type="button"
                aria-label="Talking animation"
                aria-pressed="false"
                data-state="talking"
              >
                Talk
              </button>
              <button
                type="button"
                aria-label="Happy animation"
                aria-pressed="false"
                data-state="happy"
              >
                Yay
              </button>
              <button
                type="button"
                aria-label="Surprised animation"
                aria-pressed="false"
                data-state="surprised"
              >
                Wow
              </button>
            </div>
            <p class="key-hint">Arrow keys or WASD also work</p>
          </div>
        </nav>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
